u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e0.2\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e5.47\u003c/td\u003e\u003ctd\u003e25.7\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e(E)\u003c/td\u003e\u003ctd colspan=\"9\"\u003epositional embedding instead of sinusoids\u003c/td\u003e\u003ctd\u003e4.92\u003c/td\u003e\u003ctd\u003e25.7\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ebig\u003c/td\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003e1024\u003c/td\u003e\u003ctd\u003e4096\u003c/td\u003e\u003ctd\u003e16\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e0.3\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e300K\u003c/td\u003e\u003ctd\u003e4.33\u003c/td\u003e\u003ctd\u003e26.4\u003c/td\u003e\u003ctd\u003e213\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e"},{"blockId":"p0008-b0002","kind":"content","markdown":"development set, newstest2013. We used beam search as described in the previous section, but no checkpoint averaging. We present these results in Table 3.","translation":"개발 세트, newstest2013에서 평가했습니다. 이전 섹션에서 설명한 빔 서치(beam search)를 사용했지만, 체크포인트 평균화(checkpoint averaging)는 적용하지 않았습니다. 이러한 결과를 표 3에 제시합니다."},{"blockId":"p0008-b0003","kind":"content","markdown":"In Table 3 rows (A), we vary the number of attention heads and the attention key and value dimensions, keeping the amount of computation constant, as described in Section 3.2.2. While single-head attention is 0.9 BLEU worse than the best setting, quality also drops off with too many heads.","translation":"Table 3의 (A) 행에서, Section 3.2.2에 설명된 대로 계산량을 일정하게 유지하면서 어텐션 헤드의 개수와 어텐션 키 및 값 차원을 변화시킨다. 단일 헤드 어텐션은 최고 성능 설정보다 0.9 BLEU 낮지만, 헤드가 너무 많으면 품질도 저하된다."},{"blockId":"p0008-b0004","kind":"content","markdown":"In Table 3 rows (B), we observe that reducing the attention key size  $ d_k $ hurts model quality. This suggests that determining compatibility is not easy and that a more sophisticated compatibility function than dot product may be beneficial. We further observe in rows (C) and (D) that, as expected, bigger models are better, and dropout is very helpful in avoiding over-fitting. In row (E) we replace our sinusoidal positional encoding with learned positional embeddings [9], and observe nearly identical results to the base model.","translation":"표 3의 (B)행에서는 attention key 크기를 $ d_k $ 줄이면 모델 품질이 저하됨을 관찰할 수 있습니다. 이는 호환성 결정이 쉽지 않으며, dot product보다 더 정교한 호환성 함수가 유리할 수 있음을 시사합니다. (C)행과 (D)행에서는 예상대로 더 큰 모델이 더 좋으며, dropout이 과적합을 피하는 데 매우 도움이 됨을 관찰합니다. (E)행에서는 sinusoidal positional encoding을 학습된 positional embedding [9]으로 교체하고, 기본 모델과 거의 동일한 결과를 관찰합니다."}],"section:sources/06-results/06-03-english-constituency-parsing.md":[{"blockId":"p0008-b0006","kind":"content","markdown":"To evaluate if the Transformer can generalize to other tasks we performed experiments on English constituency parsing. This task presents specific challenges: the output is subject to strong structural constraints and is significantly longer than the input. Furthermore, RNN sequence-to-sequence models have not been able to attain state-of-the-art results in small-data regimes [37].","translation":"Transformer이 다른 작업으로 일반화될 수 있는지 평가하기 위해 우리는 영어 구성 성분 파싱에 대한 실험을 수행했습니다. 이 작업은 특정한 문제를 제시합니다: 출력은 강한 구조적 제약을 받으며 입력보다 훨씬 깁니다. 게다가 RNN 시퀀스-투-시퀀스 모델은 소규모 데이터 체제에서 최첨단 결과를 달성하지 못했습니다 [37]."},{"blockId":"p0008-b0007","kind":"content","markdown":"We trained a 4-layer transformer with  $ d_{model} = 1024 $ on the Wall Street Journal (WSJ) portion of the Penn Treebank [25], about 40K training sentences. We also trained it in a semi-supervised setting, using the larger high-confidence and BerkleyParser corpora from with approximately 17M sentences [37]. We used a vocabulary of 16K tokens for the WSJ only setting and a vocabulary of 32K tokens for the semi-supervised setting.","translation":"우리는 4층 트랜스포머를 $ d_{model} = 1024 $로 Penn Treebank의 Wall Street Journal (WSJ) 부분 [25]에서 학습시켰으며, 약 40K개의 학습 문장을 사용했다. 또한 준지도 학습 설정에서 학습시켰으며, 약 17M개의 문장을 포함하는 더 큰 고신뢰도 및 BerkleyParser 코퍼스를 사용했다 [37]. WSJ만 사용하는 설정에는 16K 토큰의 어휘를 사용했으며, 준지도 학습 설정에는 32K 토큰의 어휘를 사용했다."},{"blockId":"p0008-b0008","kind":"content","markdown":"We performed only a small number of experiments to select the dropout, both attention and residual (section 5.4), learning rates and beam size on the Section 22 development set, all other parameters remained unchanged from the English-to-German base translation model. During inference, we","translation":"우리는 Section 22 개발 세트에서 dropout, attention 및 residual(섹션 5.4)의 선택, 학습률 및 beam size에 대해 소수의 실험만 수행했으며, 다른 모든 매개변수는 영어-독일어 기본 번역 모델에서 변경되지 않은 상태로 유지되었습니다. 추론 중에 우리는"},{"blockId":"p0009-b0000","kind":"caption","markdown":"\u003cfigure_title\u003eTable 4: The Transformer generalizes well to English constituency parsing (Results are on Section 23 of WSJ)\u003c/figure_title\u003e"},{"blockId":"p0009-b0001","kind":"content","markdown":"\u003ctable data-asset-key=\"table_3\"\u003e\u003ctr\u003e\u003ctd\u003eParser\u003c/td\u003e\u003ctd\u003eTraining\u003c/td\u003e\u003ctd\u003eWSJ 23 F1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVinyals \u0026amp; Kaiser et al. (2014) [37]\u003c/td\u003e\u003ctd\u003eWSJ only, discriminative\u003c/td\u003e\u003ctd\u003e88.3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePetrov et al. (2006) [29]\u003c/td\u003e\u003ctd\u003eWSJ only, discriminative\u003c/td\u003e\u003ctd\u003e90.4\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eZhu et al. (2013) [40]\u003c/td\u003e\u003ctd\u003eWSJ only, discriminative\u003c/td\u003e\u003ctd\u003e90.4\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDyer et al. (2016) [8]\u003c/td\u003e\u003ctd\u003eWSJ only, discriminative\u003c/td\u003e\u003ctd\u003e91.7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTransformer (4 layers)\u003c/td\u003e\u003ctd\u003eWSJ only, discriminative\u003c/td\u003e\u003ctd\u003e91.3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eZhu et al. (2013) [40]\u003c/td\u003e\u003ctd\u003esemi-supervised\u003c/td\u003e\u003ctd\u003e91.3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHuang \u0026amp; Harper (2009) [14]\u003c/td\u003e\u003ctd\u003esemi-supervised\u003c/td\u003e\u003ctd\u003e91.3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMcClosky et al. (2006) [26]\u003c/td\u003e\u003ctd\u003esemi-supervised\u003c/td\u003e\u003ctd\u003e92.1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVinyals \u0026amp; Kaiser et al. (2014) [37]\u003c/td\u003e\u003ctd\u003esemi-supervised\u003c/td\u003e\u003ctd\u003e92.1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTransformer (4 layers)\u003c/td\u003e\u003ctd\u003esemi-supervised\u003c/td\u003e\u003ctd\u003e92.7\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLuong et al. (2015) [23]\u003c/td\u003e\u003ctd\u003emulti-task\u003c/td\u003e\u003ctd\u003e93.0\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDyer et al. (2016) [8]\u003c/td\u003e\u003ctd\u003egenerative\u003c/td\u003e\u003ctd\u003e93.3\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e"},{"blockId":"p0009-b0002","kind":"content","markdown":"increased the maximum output length to input length + 300. We used a beam size of 21 and  $ \\alpha = 0.3 $ for both WSJ only and the semi-supervised setting.","translation":"최대 출력 길이를 입력 길이 + 300으로 증가시켰습니다. WSJ만 사용한 경우와 반지도 학습 설정 모두에서 빔 크기 21과 $ \\alpha = 0.3 $을(를) 사용했습니다."},{"blockId":"p0009-b0003","kind":"content","markdown":"Our results in Table 4 show that despite the lack of task-specific tuning our model performs surprisingly well, yielding better results than all previously reported models with the exception of the Recurrent Neural Network Grammar [8].","translation":"표 4의 결과는 작업별 미세 조정이 부족함에도 불구하고 우리 모델이 놀랍도록 잘 수행되며, Recurrent Neural Network Grammar [8]를 제외한 모든 이전에 보고된 모델보다 더 나은 결과를 낳는다는 것을 보여줍니다."},{"blockId":"p0009-b0004","kind":"content","markdown":"In contrast to RNN sequence-to-sequence models [37], the Transformer outperforms the Berkeley-Parser [29] even when training only on the WSJ training set of 40K sentences.","translation":"RNN 시퀀스-투-시퀀스 모델 [37]과 대조적으로, Transformer는 WSJ 훈련 세트의 40K 문장에서만 훈련할 때도 Berkeley-Parser [29]를 능가합니다."}],"section:sources/07-conclusion.md":[{"blockId":"p0009-b0006","kind":"content","markdown":"In this work, we presented the Transformer, the first sequence transduction model based entirely on attention, replacing the recurrent layers most commonly used in encoder-decoder architectures with multi-headed self-attention.","translation":"본 연구에서 우리는 Transformer를 제시했으며, 이는 전적으로 attention에 기반한 최초의 sequence transduction 모델로서, encoder-decoder 아키텍처에서 가장 일반적으로 사용되는 recurrent layer들을 multi-headed self-attention으로 대체했다."},{"blockId":"p0009-b0007","kind":"content","markdown":"For translation tasks, the Transformer can be trained significantly faster than architectures based on recurrent or convolutional layers. On both WMT 2014 English-to-German and WMT 2014 English-to-French translation tasks, we achieve a new state of the art. In the former task our best model outperforms even all previously reported ensembles.","translation":"번역 작업의 경우, Transformer는 순환 또는 합성곱 계층 기반 아키텍처보다 훨씬 더 빠르게 학습될 수 있습니다. WMT 2014 English-to-German 및 WMT 2014 English-to-French 번역 작업 모두에서 우리는 새로운 최첨단 결과를 달성합니다. 전자의 작업에서 우리의 최고 모델은 이전에 보고된 모든 앙상블을 능가합니다."},{"blockId":"p0009-b0008","kind":"content","markdown":"We are excited about the future of attention-based models and plan to apply them to other tasks. We plan to extend the Transformer to problems involving input and output modalities other than text and to investigate local, restricted attention mechanisms to efficiently handle large inputs and outputs such as images, audio and video. Making generation less sequential is another research goal of ours.","translation":"우리는 어텐션 기반 모델의 미래에 대해 흥분하고 있으며 이를 다른 작업에 적용할 계획입니다. 우리는 Transformer를 텍스트 이외의 입력 및 출력 모달리티를 포함하는 문제로 확장할 계획이며, 이미지, 오디오 및 비디오와 같은 대규모 입력 및 출력을 효율적으로 처리하기 위해 국소적이고 제한된 어텐션 메커니즘을 조사할 계획입니다. 생성을 덜 순차적으로 만드는 것도 우리의 또 다른 연구 목표입니다."},{"blockId":"p0009-b0009","kind":"content","markdown":"The code we used to train and evaluate our models is available at https://github.com/tensorflow/tensor2tensor.","translation":"우리가 모델을 훈련하고 평가하기 위해 사용한 코드는 https://github.com/tensorflow/tensor2tensor.에서 이용할 수 있습니다."},{"blockId":"p0009-b0010","kind":"content","markdown":"Acknowledgements We are grateful to Nal Kalchbrenner and Stephan Gouws for their fruitful comments, corrections and inspiration.","translation":"감사의 말\n\nNal Kalchbrenner와 Stephan Gouws의 건설적인 의견, 수정 사항, 그리고 영감을 주신 것에 감사드립니다."}]}}</script>
  <script>
    const bundle = JSON.parse(document.getElementById("bundle-data").textContent);
    const container = document.getElementById("mindmap");
    const mainPanel = document.querySelector(".viewer-main");
    const detailPanel = document.getElementById("detail-panel");
    const detailResizer = document.getElementById("detail-resizer");
    const translationButton = document.getElementById("translation-mode");
    const translationLabel = document.getElementById("translation-mode-label");
    const DEFAULT_DETAIL_PERCENT = 40;
    const MIN_PANEL_WIDTH = 280;
    let selectedId = null;
    let root;
    let svg;
    let viewport;
    let zoom;
    let translationMode = loadTranslationMode();

    function loadTranslationMode() {
      try {
        const saved = localStorage.getItem("ymc-viz-translation-mode");
        return ["off", "below", "side"].includes(saved) ? saved : "off";
      } catch (_) {
        return "off";
      }
    }

    function normalizePath(value) {
      const parts = [];
      for (const part of value.split("/")) {
        if (!part || part === ".") continue;
        if (part === "..") parts.pop(); else parts.push(part);
      }
      return parts.join("/");
    }

    function renderMarkdown(markdown) {
      if (!window.marked || !window.DOMPurify) {
        const pre = document.createElement("pre");
        pre.textContent = markdown;
        return pre;
      }
      const wrapper = document.createElement("div");
      const bodyMarkdown = markdown.replace(/^---\r?\n[\s\S]*?\r?\n---(?:\r?\n|$)/, "");
      wrapper.innerHTML = DOMPurify.sanitize(marked.parse(bodyMarkdown, { gfm: true }), {
        ADD_TAGS: ["display_formula", "figure_title"],
        ADD_ATTR: ["data-asset-key"],
        FORBID_TAGS: ["script", "style"],
        FORBID_ATTR: ["style"]
      });
      wrapper.querySelectorAll("img[data-asset-key]:not([src])").forEach((image) => {
        const assetKey = image.dataset.assetKey;
        const source = bundle.images[assetKey];
        if (!source) {
          const placeholder = document.createElement("div");
          placeholder.className = "asset-placeholder";
          placeholder.textContent = `Image unavailable: ${assetKey}`;
          image.replaceWith(placeholder);
          return;
        }
        image.src = source;
        image.alt = `Paper image ${assetKey}`;
        image.title = `${assetKey} · click to enlarge`;
        image.loading = "lazy";
        image.decoding = "async";
        image.className = "paper-image";
        image.addEventListener("click", () => openImageLightbox(image));
      });
      wrapper.querySelectorAll("table").forEach((table) => {
        const frame = document.createElement("div");
        frame.className = "paper-table-scroll";
        table.replaceWith(frame);
        frame.appendChild(table);
      });
      if (window.renderMathInElement) {
        renderMathInElement(wrapper, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false,
          errorColor: "#ff9d9d",
          strict: "warn"
        });
      }
      return wrapper;
    }

    function openImageLightbox(image) {
      const dialog = document.getElementById("image-lightbox");
      const enlarged = document.getElementById("lightbox-image");
      enlarged.src = image.src;
      enlarged.alt = image.alt;
      dialog.showModal();
    }

    function wireMarkdownLinks(rendered, currentPath) {
      const currentDirectory = currentPath.includes("/") ? currentPath.slice(0, currentPath.lastIndexOf("/")) : "";
      rendered.querySelectorAll("a[href]").forEach((anchor) => {
        const href = anchor.getAttribute("href");
        if (!href || href.startsWith("#")) return;
        if (/^[a-z][a-z0-9+.-]*:/i.test(href)) {
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          return;
        }
        const targetPath = normalizePath(`${currentDirectory}/${href.split("#", 1)[0]}`);
        const targetId = bundle.pathToId[targetPath];
        if (targetId) {
          anchor.addEventListener("click", (event) => {
            event.preventDefault();
            openDocumentById(targetId);
          });
        }
      });
    }

    function findNodeById(nodeId) {
      let found = null;
      function visit(node) {
        if (node.data.id === nodeId) {
          found = node;
          return;
        }
        for (const child of node._children || []) {
          if (!found) visit(child);
        }
      }
      visit(root);
      return found;
    }

    function openDocumentById(nodeId) {
      const node = findNodeById(nodeId);
      if (node) openDocument(node);
    }

    function openDocument(node) {
      const markdown = bundle.bodies[node.data.id];
      if (!markdown) return;
      revealNode(node);
      selectedId = node.data.id;
      document.getElementById("detail-title").textContent = node.data.label;
      renderSectionNavigation(node.data.id);
      renderDocumentBody(node, markdown);
      updateTranslationButton(node.data.id);
      mainPanel.classList.add("detail-open");
      detailPanel.setAttribute("aria-hidden", "false");
      update(false);
      detailPanel.scrollTop = 0;
      window.requestAnimationFrame(() => centerNode(node, true));
    }

    function renderDocumentBody(node, markdown) {
      const body = document.getElementById("detail-body");
      body.replaceChildren();
      const blocks = bundle.contentBlocks[node.data.id] || [];
      const hasTranslation = blocks.some((block) => block.translation);
      if (translationMode !== "off" && hasTranslation) {
        const content = document.createElement("div");
        content.className = "translation-content";
        for (const block of blocks) content.appendChild(renderTranslationRow(block, node.data.path));
        body.appendChild(content);
        return;
      }
      const rendered = renderMarkdown(markdown);
      body.appendChild(rendered);
      wireMarkdownLinks(rendered, node.data.path);
      removeRedundantBodyHeading(rendered, node.data.label);
    }

    function renderTranslationRow(block, currentPath) {
      const row = document.createElement("div");
      row.className = `translation-row${block.translation ? " has-translation" : ""}`;
      row.dataset.mode = translationMode;
      const source = document.createElement("section");
      source.className = "translation-source";
      source.dataset.blockId = block.blockId;
      const sourceMarkdown = renderMarkdown(block.markdown);
      source.appendChild(sourceMarkdown);
      wireMarkdownLinks(sourceMarkdown, currentPath);
      row.appendChild(source);
      if (block.translation) {
        const rule = document.createElement("span");
        rule.className = "translation-rule";
        rule.setAttribute("aria-hidden", "true");
        const translated = document.createElement("aside");
        translated.className = `translation-copy${block.kind === "caption" ? " caption" : ""}`;
        translated.setAttribute("role", "note");
        translated.appendChild(renderMarkdown(block.translation));
        row.append(rule, translated);
      }
      return row;
    }

    function updateTranslationButton(nodeId) {
      const blocks = bundle.contentBlocks[nodeId] || [];
      const hasTranslation = blocks.some((block) => block.translation);
      const labels = { off: "번역", below: "번역 · 아래", side: "번역 · 옆" };
      translationButton.disabled = !hasTranslation;
      translationButton.title = hasTranslation ? labels[translationMode] : "이 섹션은 번역이 준비되지 않았습니다";
      translationButton.setAttribute("aria-pressed", translationMode === "off" ? "false" : "true");
      translationButton.setAttribute("aria-label", labels[translationMode]);
      translationLabel.textContent = labels[translationMode];
    }

    function cycleTranslationMode() {
      translationMode = translationMode === "off" ? "below" : translationMode === "below" ? "side" : "off";
      try { localStorage.setItem("ymc-viz-translation-mode", translationMode); } catch (_) {}
      const node = selectedId ? findNodeById(selectedId) : null;
      if (!node) return;
      if (translationMode === "side") {
        setDetailWidthFromPixels(mainPanel.getBoundingClientRect().width * .66);
      }
      renderDocumentBody(node, bundle.bodies[node.data.id]);
      updateTranslationButton(node.data.id);
    }

    function closeDocument() {
      mainPanel.classList.remove("detail-open");
      detailPanel.setAttribute("aria-hidden", "true");
      selectedId = null;
      update(false);
    }

    function removeRedundantBodyHeading(rendered, title) {
      const firstHeading = rendered.querySelector("h1, h2, h3, h4, h5, h6");
      if (firstHeading && firstHeading.textContent.trim() === title.trim()) firstHeading.remove();
    }

    function revealNode(node) {
      let current = node.parent;
      while (current) {
        if (current._children) current.children = current._children;
        current = current.parent;
      }
    }

    function renderSectionNavigation(nodeId) {
      const navigation = document.getElementById("detail-section-nav");
      navigation.replaceChildren();
      const index = bundle.documentOrder.indexOf(nodeId);
      const node = findNodeById(nodeId);
      if (node && node.parent && node.parent !== root) {
        navigation.appendChild(makeSectionNavigationButton(node.parent.data.id, "parent"));
      }
      if (index < 0) {
        navigation.hidden = !navigation.children.length;
        return;
      }
      if (index > 0) navigation.appendChild(makeSectionNavigationButton(bundle.documentOrder[index - 1], "previous"));
      if (index + 1 < bundle.documentOrder.length) navigation.appendChild(makeSectionNavigationButton(bundle.documentOrder[index + 1], "next"));
      navigation.hidden = !navigation.children.length;
    }

    function makeSectionNavigationButton(targetId, direction) {
      const target = findNodeById(targetId);
      const button = document.createElement("button");
      button.type = "button";
      button.className = `section-nav-link ${direction}`;
      button.addEventListener("click", () => openDocumentById(targetId));
      const directionLabel = document.createElement("span");
      directionLabel.className = "section-nav-direction";
      directionLabel.textContent = direction === "parent"
        ? "↑ Parent section"
        : direction === "previous" ? "← Previous section" : "Next section →";
      const title = document.createElement("span");
      title.className = "section-nav-title";
      title.textContent = target ? target.data.label : targetId;
      button.append(directionLabel, title);
      return button;
    }

    function toggleNode(node) {
      if (!node._children || !node._children.length) {
        openDocument(node);
        return;
      }
      node.children = node.children ? null : node._children;
      update(false);
      window.requestAnimationFrame(() => centerNode(node, true));
    }

    function setExpanded(node, expanded) {
      if (!node._children || !node._children.length) return;
      node.children = expanded ? node._children : null;
      for (const child of node._children) setExpanded(child, expanded);
    }

    function splitNodeLabel(node) {
      if (node === root) return { index: "Paper", title: node.data.label };
      const match = node.data.label.match(/^(\d+(?:\.\d+)*)\s+(.+)$/);
      if (match) return { index: `Section ${match[1]}`, title: match[2] };
      return { index: "Section", title: node.data.label };
    }

    function nodeAppearance(node) {
      if (node === root) return { background: "#1f3552", border: "#1f3552", accent: "#e8c98f", text: "#fffdf7", muted: "#e8c98f", tag: "rgb(232 201 143 / .12)" };
      if (node.depth === 1) return { background: "#261b17", border: "#261b17", accent: "#e8c98f", text: "#fffdf7", muted: "#e8c98f", tag: "rgb(232 201 143 / .12)" };
      if (node.depth === 2) return { background: "#fffdf7", border: "#d8ccbb", accent: "#1f3552", text: "#38332e", muted: "#1f3552", tag: "#e4eaf1" };
      return { background: "#f9f3e8", border: "#d8ccbb", accent: "#a48248", text: "#38332e", muted: "#806532", tag: "#f4ebdd" };
    }

    function branchColor(node) { return node.depth <= 1 ? "#1f3552" : node.depth === 2 ? "#a48248" : "#b8aa97"; }

    function linkPath(link) {
      const sourceY = link.source.y + (link.source === root ? 107 : 80);
      const targetY = link.target.y - 66;
      const middleY = (sourceY + targetY) / 2;
      return `M${link.source.x},${sourceY}C${link.source.x},${middleY} ${link.target.x},${middleY} ${link.target.x},${targetY}`;
    }

    function update(shouldFit) {
      d3.tree().nodeSize([214, 230])(root);
      const nodes = root.descendants();
      const links = root.links();
      const motionDuration = 240;

      const linkSelection = viewport.selectAll("path.map-link")
        .data(links, (item) => item.target.data.id)
        .join(
          (enter) => enter.append("path").attr("class", "map-link").style("opacity", 0),
          (updateSelection) => updateSelection,
          (exit) => exit.interrupt().transition().duration(160).style("opacity", 0).remove()
        );
      linkSelection
        .attr("stroke", (item) => branchColor(item.target))
        .interrupt()
        .transition().duration(motionDuration)
        .style("opacity", 1)
        .attr("d", linkPath);

      const nodeSelection = viewport.selectAll("g.map-node")
        .data(nodes, (item) => item.data.id)
        .join(
          (enter) => {
            const group = enter.append("g").attr("class", "map-node").style("opacity", 0);
            group.append("foreignObject")
              .append("xhtml:div").attr("class", "node-card");
            return group;
          },
          (updateSelection) => updateSelection,
          (exit) => exit.interrupt().transition().duration(160).style("opacity", 0).remove()
        );
      nodeSelection
        .interrupt()
        .transition().duration(motionDuration)
        .style("opacity", 1)
        .attr("transform", (item) => `translate(${item.x},${item.y})`);

      nodeSelection.select("foreignObject")
        .attr("x", (node) => node === root ? -107 : -89)
        .attr("y", (node) => node === root ? -99 : -68)
        .attr("width", (node) => node === root ? 230 : 190)
        .attr("height", (node) => node === root ? 230 : 166);

      nodeSelection.each(function(node) {
        const card = d3.select(this).select("div.node-card");
        const appearance = nodeAppearance(node);
        const label = splitNodeLabel(node);
        card.selectAll("*").remove();
        card
          .classed("is-root", node === root)
          .classed("is-chapter", node !== root && node.depth === 1)
          .classed("is-section", node.depth === 2)
          .classed("is-topic", node.depth >= 3)
          .classed("is-selected", node.data.id === selectedId)
          .style("--node-background", appearance.background)
          .style("--node-border", appearance.border)
          .style("--node-accent", appearance.accent)
          .style("--node-text", appearance.text)
          .style("--node-muted", appearance.muted)
          .style("--node-tag-background", appearance.tag);

        const labelButton = card.append("button")
          .attr("type", "button")
          .attr("class", "node-label")
          .attr("title", node.data.label)
          .attr("aria-label", node === root
            ? `${node.children ? "Hide" : "Show"} sections for ${node.data.label}`
            : `Open ${node.data.label}`)
          .on("click", (event) => {
            event.stopPropagation();
            if (node === root) toggleNode(node); else openDocument(node);
          });
        labelButton.append("span").attr("class", "node-index").text(label.index);
        labelButton.append("span").attr("class", "node-title-wrap")
          .append("span").attr("class", "node-title-text").text(label.title);

        if (node._children && node._children.length) {
          const childCount = node._children.length;
          const branchToggle = card.append("button")
            .attr("type", "button")
            .attr("class", "node-branch-toggle")
            .attr("aria-label", `${node.children ? "Collapse" : "Expand"} ${node.data.label}`)
            .attr("aria-expanded", node.children ? "true" : "false")
            .attr("title", node.children ? "Hide child sections" : `Show ${childCount} child ${childCount === 1 ? "section" : "sections"}`)
            .on("click", (event) => {
              event.stopPropagation();
              toggleNode(node);
            });
          branchToggle.append("span")
            .attr("class", "node-branch-label")
            .text(node.children ? "Hide" : `${childCount} ${childCount === 1 ? "section" : "sections"}`);
          branchToggle.append("svg")
            .attr("viewBox", "0 0 24 24")
            .attr("aria-hidden", "true")
            .append("path")
            .attr("d", node.children ? "m7 14 5-5 5 5" : "m7 10 5 5 5-5");
        }
      });

      if (shouldFit) window.setTimeout(() => fitVisible(true), 20);
    }

    function centerNode(node, animated) {
      const currentTransform = d3.zoomTransform(svg.node());
      const scale = Math.max(currentTransform.k, .82);
      const width = container.clientWidth;
      const height = container.clientHeight;
      const transform = d3.zoomIdentity
        .translate(width / 2 - scale * node.x, height / 2 - scale * node.y)
        .scale(scale);
      const target = animated ? svg.transition().duration(240) : svg;
      target.call(zoom.transform, transform);
    }

    function fitVisible(animated) {
      const bounds = viewport.node().getBBox();
      if (!bounds.width || !bounds.height) return;
      const width = container.clientWidth;
      const height = container.clientHeight;
      const padding = 52;
      const scale = Math.min(.95, Math.max(.22, Math.min(
        (width - padding * 2) / bounds.width,
        (height - padding * 2) / bounds.height
      )));
      const transform = d3.zoomIdentity
        .translate(width / 2 - scale * (bounds.x + bounds.width / 2), height / 2 - scale * (bounds.y + bounds.height / 2))
        .scale(scale);
      const target = animated ? svg.transition().duration(220) : svg;
      target.call(zoom.transform, transform);
    }

    function zoomBy(factor) { svg.transition().duration(160).call(zoom.scaleBy, factor); }

    function setDetailWidthFromPixels(requestedWidth) {
      const mainWidth = mainPanel.getBoundingClientRect().width;
      const availableWidth = Math.max(0, mainWidth - detailResizer.offsetWidth);
      if (!availableWidth) return;
      const minimumWidth = Math.min(MIN_PANEL_WIDTH, availableWidth / 2);
      const detailWidth = Math.min(
        Math.max(requestedWidth, minimumWidth),
        Math.max(minimumWidth, availableWidth - minimumWidth)
      );
      const detailPercent = detailWidth / availableWidth * 100;
      const detailFlexPercent = detailWidth / mainWidth * 100;
      mainPanel.style.setProperty("--detail-width", `${detailFlexPercent}%`);
      detailResizer.setAttribute("aria-valuemin", String(Math.round(minimumWidth / availableWidth * 100)));
      detailResizer.setAttribute("aria-valuemax", String(Math.round((availableWidth - minimumWidth) / availableWidth * 100)));
      detailResizer.setAttribute("aria-valuenow", String(Math.round(detailPercent)));
    }

    function resizeDetailFromPointer(event) {
      const bounds = mainPanel.getBoundingClientRect();
      setDetailWidthFromPixels(bounds.right - event.clientX);
    }

    detailResizer.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      detailResizer.setPointerCapture(event.pointerId);
      document.body.classList.add("detail-resizing");
      resizeDetailFromPointer(event);
    });
    detailResizer.addEventListener("pointermove", (event) => {
      if (detailResizer.hasPointerCapture(event.pointerId)) resizeDetailFromPointer(event);
    });
    function stopDetailResize(event) {
      if (detailResizer.hasPointerCapture(event.pointerId)) detailResizer.releasePointerCapture(event.pointerId);
      document.body.classList.remove("detail-resizing");
    }
    detailResizer.addEventListener("pointerup", stopDetailResize);
    detailResizer.addEventListener("pointercancel", stopDetailResize);
    detailResizer.addEventListener("dblclick", () => {
      const availableWidth = mainPanel.getBoundingClientRect().width - detailResizer.offsetWidth;
      setDetailWidthFromPixels(availableWidth * DEFAULT_DETAIL_PERCENT / 100);
    });
    detailResizer.addEventListener("keydown", (event) => {
      if (!["ArrowLeft", "ArrowRight", "Home"].includes(event.key)) return;
      event.preventDefault();
      const availableWidth = mainPanel.getBoundingClientRect().width - detailResizer.offsetWidth;
      if (event.key === "Home") {
        setDetailWidthFromPixels(availableWidth * DEFAULT_DETAIL_PERCENT / 100);
        return;
      }
      const step = event.shiftKey ? 64 : 24;
      const currentWidth = detailPanel.getBoundingClientRect().width;
      setDetailWidthFromPixels(currentWidth + (event.key === "ArrowLeft" ? step : -step));
    });
    window.addEventListener("resize", () => {
      if (mainPanel.classList.contains("detail-open")) setDetailWidthFromPixels(detailPanel.getBoundingClientRect().width);
    });

    function initializeMindMap() {
      if (!window.d3) {
        container.innerHTML = '<div class="viewer-error">The mind-map library could not be loaded.</div>';
        return;
      }
      root = d3.hierarchy(bundle.tree);
      const allNodes = root.descendants();
      allNodes.forEach((node) => { node._children = node.children || null; });
      allNodes.forEach((node) => { node.children = null; });

      svg = d3.select(container).append("svg").attr("role", "img");
      svg.append("title").text(`Mind map for ${bundle.title}`);
      viewport = svg.append("g");
      zoom = d3.zoom().scaleExtent([.15, 2.5]).on("zoom", (event) => viewport.attr("transform", event.transform));
      svg.call(zoom).on("dblclick.zoom", null);
      update(false);
      fitVisible(false);

      document.getElementById("expand-all").addEventListener("click", () => { setExpanded(root, true); update(true); });
      document.getElementById("collapse-all").addEventListener("click", () => { setExpanded(root, false); closeDocument(); update(true); });
      document.getElementById("fit-map").addEventListener("click", () => fitVisible(true));
      document.getElementById("zoom-in").addEventListener("click", () => zoomBy(1.25));
      document.getElementById("zoom-out").addEventListener("click", () => zoomBy(.8));
    }

    document.getElementById("close-detail").addEventListener("click", closeDocument);
    translationButton.addEventListener("click", cycleTranslationMode);
    const lightbox = document.getElementById("image-lightbox");
    document.getElementById("close-lightbox").addEventListener("click", () => lightbox.close());
    lightbox.addEventListener("click", (event) => { if (event.target === lightbox) lightbox.close(); });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && mainPanel.classList.contains("detail-open")) closeDocument();
    });
    initializeMindMap();
  </script>
</body>
</html>
