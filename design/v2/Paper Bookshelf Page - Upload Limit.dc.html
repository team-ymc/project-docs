<script type="text/x-dc" data-dc-script data-props='{"plan":{"editor":"enum","options":["FREE","PRO"],"default":"FREE","section":"플랜"},"paperUsed":{"editor":"int","default":3,"min":0,"max":3,"unit":"회","section":"사용량"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {

  plan() {
    const isPro = (this.props.plan ?? 'FREE') === 'PRO';
    const aiUsed = Math.max(0, Math.min(100, Number(this.props.aiUsed ?? 37) || 0));
    const paperUsed = Math.max(0, Math.min(3, Number(this.props.paperUsed ?? 1) || 0));
    const reset = (label, remaining) => remaining === 0 ? '모두 사용 · 9월 1일 00:00 초기화' : `남은 ${label} ${remaining}회 · 9월 1일 초기화`;
    return {
      isPro, isFree: !isPro,
      badgeTone: isPro ? 'pro' : 'neutral',
      badgeToneOnDark: isPro ? 'proOnDark' : 'neutralOnDark',
      badgeIcon: isPro ? 'seal-check' : '',
      badgeText: isPro ? 'Pro' : 'Free',
      periodLabel: isPro ? 'Pro · 9월 26일까지' : '8월 1일 – 31일',
      aiUsed, paperUsed,
      aiReset: isPro ? '' : reset('질문', 100 - aiUsed),
      paperReset: isPro ? '' : reset('등록', 3 - paperUsed),
      aiRemaining: isPro ? Infinity : 100 - aiUsed,
      paperRemaining: isPro ? Infinity : 3 - paperUsed
    };
  }

  renderVals() {
    const p = this.plan();
    return { ...p, locked: p.paperRemaining === 0, openUpload: () => {} };
  }
}
</script>
