# BE ↔ AI SQS 메시지 계약
#
# - SQS 선택과 전달 의미론(at-least-once, visibility timeout, DLQ)은
#   decisions/ADR-002-be-ai-messaging-sqs.md가 소유한다.
# - 파싱과 지식 번들 생성의 채널·payload 계약은 이 문서가 소유한다.
# - 요청 삭제, heartbeat, 재시도와 애플리케이션·인프라 책임은
#   contracts/backend-ai/sqs/README.md가 설명한다.
#
# 이 파일은 OpenAPI/AsyncAPI 문서가 아니다. schemas의 각 항목은 JSON Schema다.

version: 0.5.0

# wire 규칙
# - 송신 측과 계약 검증 테스트는 additionalProperties: false를 따른다.
# - 수신 측은 forward compatibility를 위해 모르는 필드를 관대하게 무시할 수 있다.
# - 중간 progress 메시지는 없으며 각 result 큐에는 해당 단계의 최종 결과만 발행한다.
# - 파싱 성공 결과를 BE가 반영한 뒤 knowledge-compile-requests를 발행한다.
#   지식 번들 생성은 이미 완료된 파싱 결과의 사용 가능 상태를 되돌리지 않는다.

channels:
  parse-requests:
    direction: BE → AI
    message: "#/schemas/ParseRequest"
  parse-results:
    direction: 파싱 결과 producer → BE
    message: "#/schemas/ParseResult"
  knowledge-compile-requests:
    direction: BE → AI
    message: "#/schemas/KnowledgeCompileRequest"
  knowledge-compile-results:
    direction: 지식 번들 생성 결과 producer → BE
    message: "#/schemas/KnowledgeCompileResult"

schemas:
  ParseRequest:
    type: object
    required: [paper_id, file_key]
    additionalProperties: false
    properties:
      paper_id:
        type: string
        minLength: 1
        description: >-
          이 파싱 작업과 Paper를 연결하는 BE 도메인 식별자이자 요청·결과의
          상관관계 키. AI worker가 안전하게 처리할 수 있도록 빈 문자열, 절대 경로,
          슬래시, 역슬래시, 단일 점(.)과 이중 점(..)은 허용하지 않는다.
      file_key:
        type: string
        minLength: 1
        description: >-
          원본 PDF가 저장된 불투명한 S3 object key. AI는 이 값을 그대로
          GetObject에 사용하며 형식을 해석하거나 paper_id로 키를 조립하지 않는다.
          키 형식은 BE 저장소 내부 구현이므로 버전이 섞일 수 있다.

  ParseResult:
    oneOf:
      - $ref: "#/schemas/ParseCompletedResult"
      - $ref: "#/schemas/ParseFailedResult"

  ParseCompletedResult:
    type: object
    required: [paper_id, status, message, manifest_key]
    additionalProperties: false
    properties:
      paper_id:
        type: string
        minLength: 1
        description: 대응하는 ParseRequest의 paper_id.
      status:
        const: completed
      message:
        type: string
        minLength: 1
        description: 사람이 읽을 수 있는 완료 설명. 상태 판정에는 사용하지 않는다.
      manifest_key:
        type: string
        minLength: 1
        description: >-
          생성된 document package의 manifest.json을 가리키는 S3 object key.
          URL이나 bucket 이름을 포함하지 않는다.

  ParseFailedResult:
    type: object
    required: [paper_id, status, error]
    additionalProperties: false
    properties:
      paper_id:
        type: string
        minLength: 1
        description: 대응하는 ParseRequest의 paper_id.
      status:
        const: failed
      error:
        $ref: "#/schemas/ParseError"

  ParseError:
    type: object
    required: [code, message]
    additionalProperties: false
    properties:
      code:
        type: string
        enum:
          - FILE_KEY_INVALID
          - PAPER_ID_INVALID
          - DOCUMENT_SOURCE_NOT_FOUND
          - PADDLEOCR_REQUEST_REJECTED
          - PADDLEOCR_PARSING_FAILED
          - PADDLEOCR_TEMPORARILY_UNAVAILABLE
          - PADDLEOCR_DAILY_QUOTA_EXHAUSTED
          - PARSE_RETRIES_EXHAUSTED
      message:
        type: string
        minLength: 1
        description: 사람이 읽을 수 있는 실패 설명. 분기에는 code를 사용한다.

  KnowledgeCompileRequest:
    type: object
    required: [paper_id, manifest_key]
    additionalProperties: false
    properties:
      paper_id:
        type: string
        minLength: 1
        description: >-
          원본 ParseRequest와 KnowledgeCompileResult를 같은 Paper에 연결하는
          상관관계 키. AI worker가 안전하게 처리할 수 있도록 빈 문자열, 절대 경로,
          슬래시, 역슬래시, 단일 점(.)과 이중 점(..)은 허용하지 않는다.
      manifest_key:
        type: string
        minLength: 1
        description: >-
          ParseCompletedResult.manifest_key로 받은 파싱 패키지 manifest의 불투명한
          S3 object key. AI는 이 값을 그대로 GetObject에 사용하며 paper_id로
          키를 재조합하지 않는다. URL이나 bucket 이름을 포함하지 않는다.

  KnowledgeCompileResult:
    oneOf:
      - $ref: "#/schemas/KnowledgeCompileCompletedResult"
      - $ref: "#/schemas/KnowledgeCompileFailedResult"

  KnowledgeCompileCompletedResult:
    type: object
    required:
      - paper_id
      - status
      - message
      - manifest_key
      - estimated_cost_usd
    additionalProperties: false
    properties:
      paper_id:
        type: string
        minLength: 1
        description: 대응하는 KnowledgeCompileRequest의 paper_id.
      status:
        const: completed
      message:
        type: string
        minLength: 1
        description: 사람이 읽을 수 있는 완료 설명. 상태 판정에는 사용하지 않는다.
      manifest_key:
        type: string
        minLength: 1
        description: >-
          KnowledgeCompileRequest.manifest_key로 받은 중앙 document package
          manifest.json의 S3 object key. ParseCompletedResult와 같은 필드명을
          사용하며 별도의 지식 번들 manifest를 가리키지 않는다. URL이나 bucket
          이름을 포함하지 않는다. completed 결과가 발행된 시점에는 모든 compile
          산출물 저장과 compile artifact가 추가된 중앙 manifest의 재발행이 완료되어
          있으므로, 이 key를 지식 번들 준비 완료의 publication marker로 사용한다.
      estimated_cost_usd:
        $ref: "#/schemas/KnowledgeCompileEstimatedCostUsd"

  KnowledgeCompileFailedResult:
    type: object
    required:
      - paper_id
      - status
      - error
      - estimated_cost_usd
    additionalProperties: false
    properties:
      paper_id:
        type: string
        minLength: 1
        description: 대응하는 KnowledgeCompileRequest의 paper_id.
      status:
        const: failed
      error:
        $ref: "#/schemas/KnowledgeCompileError"
      estimated_cost_usd:
        $ref: "#/schemas/KnowledgeCompileEstimatedCostUsd"

  KnowledgeCompileError:
    type: object
    required: [code, message]
    additionalProperties: false
    properties:
      code:
        type: string
        enum:
          - MANIFEST_KEY_INVALID
          - PAPER_ID_INVALID
          - PARSED_DOCUMENT_NOT_FOUND
          - PARSED_DOCUMENT_INVALID
          - LLM_RATE_LIMITED
          - KNOWLEDGE_COMPILE_RETRIES_EXHAUSTED
      message:
        type: string
        minLength: 1
        description: 사람이 읽을 수 있는 실패 설명. 분기에는 code를 사용한다.

  KnowledgeCompileEstimatedCostUsd:
    type: [string, "null"]
    pattern: "^[0-9]+\\.[0-9]{8}$"
    description: >-
      현재 SQS delivery attempt의 예상 USD 비용. 사용량이나 가격을
      완전하게 확인할 수 없으면 부분 합계 대신 null이다.
