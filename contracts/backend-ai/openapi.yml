openapi: 3.1.0
info:
  title: AI Server
  version: 0.1.0
  description: >-
    Backend에서 AI FastAPI server를 호출할 때 사용하는 HTTP 계약이다. `/stream`
    endpoint의 event 이름, 순서와 payload는 `contracts/backend-ai/sse/`의 endpoint별
    계약을 함께 따른다. SQS document parser worker는 이 OpenAPI 범위에 포함되지 않는다.
x-contract-source: team-ymc/ai app.main:app
x-contract-source-revision: 153462a
x-contract-synced-at: '2026-09-06'
paths:
  /api/v1/agents/base-pdf-agent/runs:
    post:
      tags:
      - base-pdf-agent
      summary: Run
      operationId: base-pdf-agent-run
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasePdfAgentRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasePdfAgentRunResponse'
        '400':
          $ref: '#/components/responses/AI400Error'
        '404':
          $ref: '#/components/responses/AI404Error'
        '500':
          $ref: '#/components/responses/AI500Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-error-codes:
        '400': [PAPER_ID_INVALID]
        '404': [PAPER_DOCUMENT_NOT_FOUND]
        '500': [INTERNAL_SERVER_ERROR]
  /api/v1/agents/base-pdf-agent/runs/stream:
    post:
      tags:
      - base-pdf-agent
      summary: Run Stream
      operationId: base-pdf-agent-run_stream
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasePdfAgentRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream:
              schema:
                type: string
          x-sse-contract: sse/base-pdf-agent-run-stream.yml
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
