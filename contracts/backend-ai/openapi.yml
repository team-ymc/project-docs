components:
  responses:
    AI400Error:
      description: Invalid identifier, selection, or required server configuration
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIErrorResponse'
    AI404Error:
      description: Required paper document, structure, source, or asset not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIErrorResponse'
    AI500Error:
      description: Invalid stored package or unexpected server failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIErrorResponse'
    AI502Error:
      description: Upstream translation output could not preserve the selected content
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIErrorResponse'
  schemas:
    AIErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: AIErrorDetail
    AIErrorResponse:
      properties:
        detail:
          $ref: '#/components/schemas/AIErrorDetail'
      type: object
      required:
      - detail
      title: AIErrorResponse
    BasePdfAgentRunRequest:
      properties:
        thread_id:
          type: string
          title: Thread Id
        paper_id:
          type: string
          title: Paper Id
        message:
          type: string
          title: Message
      type: object
      required:
      - thread_id
      - paper_id
      - message
      title: BasePdfAgentRunRequest
    BasePdfAgentRunResponse:
      properties:
        thread_id:
          type: string
          title: Thread Id
        paper_id:
          type: string
          title: Paper Id
        message:
          type: string
          title: Message
      type: object
      required:
      - thread_id
      - paper_id
      - message
      title: BasePdfAgentRunResponse
    DocumentParseRequest:
      properties:
        paper_id:
          type: string
          title: Paper Id
      type: object
      required:
      - paper_id
      title: DocumentParseRequest
    DocumentParseResponse:
      properties:
        paper_id:
          type: string
          title: Paper Id
        status:
          type: string
          const: completed
          title: Status
          default: completed
        message:
          type: string
          title: Message
        manifest_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Manifest Key
      type: object
      required:
      - paper_id
      - message
      - manifest_key
      title: DocumentParseResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InlinePdfAgentRunRequest:
      properties:
        thread_id:
          type: string
          minLength: 1
          title: Thread Id
        paper_id:
          type: string
          minLength: 1
          title: Paper Id
        message:
          type: string
          minLength: 1
          title: Message
        selection:
          anyOf:
          - $ref: '#/components/schemas/InlinePdfSelection'
          - type: 'null'
      type: object
      required:
      - thread_id
      - paper_id
      - message
      title: InlinePdfAgentRunRequest
    InlinePdfAgentRunResponse:
      properties:
        thread_id:
          type: string
          title: Thread Id
        paper_id:
          type: string
          title: Paper Id
        message:
          type: string
          title: Message
      type: object
      required:
      - thread_id
      - paper_id
      - message
      title: InlinePdfAgentRunResponse
    InlinePdfSelection:
      properties:
        start:
          $ref: '#/components/schemas/InlinePdfSelectionAnchor'
        end:
          $ref: '#/components/schemas/InlinePdfSelectionAnchor'
      type: object
      required:
      - start
      - end
      title: InlinePdfSelection
    InlinePdfSelectionAnchor:
      properties:
        block_id:
          type: string
          minLength: 1
          title: Block Id
        offset:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Offset
      type: object
      required:
      - block_id
      title: InlinePdfSelectionAnchor
    InlineTranslateAgentRunRequest:
      properties:
        thread_id:
          type: string
          minLength: 1
          title: Thread Id
        paper_id:
          type: string
          minLength: 1
          title: Paper Id
        selection:
          $ref: '#/components/schemas/InlineTranslateSelection'
      type: object
      required:
      - thread_id
      - paper_id
      - selection
      title: InlineTranslateAgentRunRequest
    InlineTranslateAgentRunResponse:
      properties:
        thread_id:
          type: string
          title: Thread Id
        paper_id:
          type: string
          title: Paper Id
        translation:
          type: string
          title: Translation
      type: object
      required:
      - thread_id
      - paper_id
      - translation
      title: InlineTranslateAgentRunResponse
    InlineTranslateSelection:
      properties:
        start:
          $ref: '#/components/schemas/InlineTranslateSelectionAnchor'
        end:
          $ref: '#/components/schemas/InlineTranslateSelectionAnchor'
      type: object
      required:
      - start
      - end
      title: InlineTranslateSelection
    InlineTranslateSelectionAnchor:
      properties:
        block_id:
          type: string
          minLength: 1
          title: Block Id
        offset:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Offset
      type: object
      required:
      - block_id
      title: InlineTranslateSelectionAnchor
    SimpleAgentRunRequest:
      properties:
        thread_id:
          type: string
          title: Thread Id
        message:
          type: string
          title: Message
      type: object
      required:
      - thread_id
      - message
      title: SimpleAgentRunRequest
    SimpleAgentRunResponse:
      properties:
        thread_id:
          type: string
          title: Thread Id
        message:
          type: string
          title: Message
      type: object
      required:
      - thread_id
      - message
      title: SimpleAgentRunResponse
    UniversalPdfAgentRunRequest:
      properties:
        thread_id:
          type: string
          minLength: 1
          title: Thread Id
        paper_id:
          type: string
          minLength: 1
          title: Paper Id
        message:
          type: string
          minLength: 1
          title: Message
        selections:
          anyOf:
          - items:
              $ref: '#/components/schemas/UniversalPdfSelection'
            type: array
            minItems: 1
          - type: 'null'
          title: Selections
      type: object
      required:
      - thread_id
      - paper_id
      - message
      title: UniversalPdfAgentRunRequest
    UniversalPdfAgentRunResponse:
      properties:
        thread_id:
          type: string
          title: Thread Id
        paper_id:
          type: string
          title: Paper Id
        message:
          type: string
          title: Message
      type: object
      required:
      - thread_id
      - paper_id
      - message
      title: UniversalPdfAgentRunResponse
    UniversalPdfSelection:
      properties:
        start:
          $ref: '#/components/schemas/UniversalPdfSelectionAnchor'
        end:
          $ref: '#/components/schemas/UniversalPdfSelectionAnchor'
      type: object
      required:
      - start
      - end
      title: UniversalPdfSelection
    UniversalPdfSelectionAnchor:
      properties:
        block_id:
          type: string
          minLength: 1
          title: Block Id
        offset:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Offset
      type: object
      required:
      - block_id
      title: UniversalPdfSelectionAnchor
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
