version: 1
id: inline-translate-agent-run-stream
status: current
summary: 하나의 정확한 논문 선택 영역을 한국어 Markdown으로 번역해 SSE로 전송하는 endpoint이다.

sources:
  router: app/modules/inline_translate_agent/router.py
  schemas: app/modules/inline_translate_agent/schemas.py
  errors: app/modules/inline_translate_agent/errors.py
  selection_builder: app/modules/inline_translate_agent/context_builder.py
  stream_sanitizer: app/modules/inline_translate_agent/streaming.py
  implementation_repository: team-ymc/ai

transport:
  type: sse
  method: POST
  path: /api/v1/agents/inline-translate-agent/runs/stream
  response_content_type: text/event-stream
  validation_error_status: 422

request:
  content_type: application/json
  body_fields:
    - name: thread_id
      type: string
      required: true
      constraints:
        min_length: 1
      description: 요청 상관관계와 trace metadata에 사용하는 client 식별자. 대화 checkpoint에는 사용하지 않는다.
    - name: paper_id
      type: string
      required: true
      constraints:
        min_length: 1
      description: structure/document.json을 읽을 파싱된 논문 package 식별자
    - name: selection
      type: object
      required: true
      description: 번역할 정확한 start/end block anchor. 생략하거나 null로 보낼 수 없다.
      fields:
        - name: start
          type: object
          required: true
          fields:
            - name: block_id
              type: string
              required: true
              constraints:
                min_length: 1
            - name: offset
              type:
                - integer
                - 'null'
              required: false
              constraints:
                minimum: 0
              description: text block 내 UTF-16 code unit 기준 inclusive 시작 offset
        - name: end
          type: object
          required: true
          fields:
            - name: block_id
              type: string
              required: true
              constraints:
                min_length: 1
            - name: offset
              type:
                - integer
                - 'null'
              required: false
              constraints:
                minimum: 0
              description: text block 내 UTF-16 code unit 기준 exclusive 종료 offset
  selection_rules:
    - structure/document.json schema version 2의 document-wide block 순서로 범위를 해석한다.
    - text block offset은 UTF-16 code unit 기준이며 start는 inclusive, end는 exclusive이다.
    - text block의 offset을 생략하거나 null로 보내면 해당 boundary block 전체를 포함한다.
    - image, table, formula block은 atomic하므로 offset을 생략하거나 null로 보내야 한다.
    - selection은 최대 150 blocks, 선택된 source는 최대 30000 characters이다.
    - server는 선택 영역 밖의 active heading과 양쪽 최대 2개 block을 context로 사용할 수 있지만 결과에는 포함하지 않는다.
  example:
    thread_id: translation_123
    paper_id: 1706.03762v7
    selection:
      start:
        block_id: p0002-b0000
        offset: 0
      end:
        block_id: p0002-b0003
        offset: 42

translation_rules:
  - 정확히 선택된 영어 source만 한국어로 번역하며 Markdown 구조를 보존한다.
  - ASCII 영어 문자가 없는 선택 영역은 model 호출 없이 추출 결과를 반환한다.
  - 선택된 image, table, formula는 내용을 번역하지 않고 각각 독립된 backticked `이미지`, `표`, `수식` 줄로 반환한다.
  - server는 내부 보호 token과 context-only tag를 검증·제거한 sanitized Markdown만 전송한다.
  - 보호 구조를 보존할 수 없으면 손상된 번역 대신 TRANSLATION_OUTPUT_INVALID로 실패한다.

sse_format:
  data_type_matches_event: true
  example_frame: |
    event: message.delta
    data: {"type":"message.delta","thread_id":"translation_123","paper_id":"1706.03762v7","delta":"선택한 텍스트"}

event_sequences:
  success:
    description: 선택 영역 검증과 한국어 번역 또는 deterministic passthrough가 완료된 경우
    events:
      - run.started
      - message.delta
      - message.completed
      - run.completed
    notes:
      - message.delta는 0개, 1개, 또는 여러 개가 올 수 있다.
      - message.completed.message는 전송된 sanitized delta를 순서대로 이어 붙인 최종 translation이다.
  failure:
    description: package, 선택 영역, 번역 출력 검증 또는 provider 처리 중 오류가 발생한 경우
    events:
      - run.failed
    notes:
      - 유효한 request에서는 run.started가 항상 먼저 전송된다.
      - run.failed 이전에 일부 sanitized message.delta가 이미 전송되었을 수 있다.
      - stream 처리가 시작된 뒤의 오류는 HTTP 오류가 아니라 run.failed event로 전달된다.

events:
  - name: run.started
    terminal: false
    description: AI 서버가 inline translation 처리를 시작했을 때 전송한다.
    payload_fields:
      - name: type
        type: string
        required: true
        value: run.started
      - name: thread_id
        type: string
        required: true
      - name: paper_id
        type: string
        required: true

  - name: message.delta
    terminal: false
    description: 검증·정제된 번역 결과의 부분 문자열을 전송한다.
    payload_fields:
      - name: type
        type: string
        required: true
        value: message.delta
      - name: thread_id
        type: string
        required: true
      - name: paper_id
        type: string
        required: true
      - name: delta
        type: string
        required: true
        description: 최종 translation을 구성하는 sanitized Markdown 부분 문자열
    backend_notes:
      - delta를 받은 순서대로 누적한다.
      - delta 하나가 완전한 단어, 문장 또는 Markdown block이라고 가정하지 않는다.
      - server 내부 보호 token이나 context tag가 delta에 나타나면 계약 위반으로 처리한다.

  - name: message.completed
    terminal: false
    description: 전체 번역 결과가 완성되었을 때 전송한다.
    payload_fields:
      - name: type
        type: string
        required: true
        value: message.completed
      - name: thread_id
        type: string
        required: true
      - name: paper_id
        type: string
        required: true
      - name: message
        type: string
        required: true
        description: 최종 translation Markdown. 공통 agent event naming 때문에 field 이름은 message다.
    backend_notes:
      - 직접 누적한 delta보다 message.completed.message를 최종 translation으로 우선한다.

  - name: run.completed
    terminal: true
    outcome: success
    description: translation run이 성공적으로 종료되었을 때 전송한다.
    payload_fields:
      - name: type
        type: string
        required: true
        value: run.completed
      - name: thread_id
        type: string
        required: true
      - name: paper_id
        type: string
        required: true

  - name: run.failed
    terminal: true
    outcome: failure
    description: 선택 영역 준비, 번역 또는 출력 검증에 실패했을 때 전송한다.
    payload_fields:
      - name: type
        type: string
        required: true
        value: run.failed
      - name: thread_id
        type: string
        required: true
      - name: paper_id
        type: string
        required: true
      - name: error
        type: object
        required: true
        fields:
          - name: code
            type: string
            required: true
            allowed_values:
              - PAPER_ID_INVALID
              - PAPER_STRUCTURE_NOT_FOUND
              - PAPER_STRUCTURE_INVALID
              - SELECTION_BLOCK_NOT_FOUND
              - SELECTION_RANGE_INVALID
              - SELECTION_OFFSET_INVALID
              - SELECTION_TOO_LARGE
              - TRANSLATION_OUTPUT_INVALID
              - INTERNAL_SERVER_ERROR
          - name: message
            type: string
            required: true
            description: client에 노출 가능한 안정적인 오류 메시지

backend_handling:
  - 모든 event의 thread_id와 paper_id가 요청 값과 일치하는지 확인한다.
  - message.delta는 순서대로 누적하되 terminal success 전에는 번역을 확정하지 않는다.
  - message.completed.message를 일반 HTTP response의 translation과 같은 최종 값으로 사용한다.
  - run.completed를 성공 종료로 처리한다.
  - run.failed를 실패 종료로 처리하고 error.code로 오류를 분기한다.
  - run.failed 이전에 받은 partial delta는 최종 translation으로 저장하지 않는다.
  - TRANSLATION_OUTPUT_INVALID는 source component/경계 보존 실패로 처리하며 partial 결과를 사용하지 않는다.
  - stream 연결 자체가 실패하거나 terminal event 전에 끊기면 outcome을 불확정으로 처리한다.

limitations:
  - stream resume과 SSE event id를 지원하지 않는다.
  - 번역 방향은 현재 영어에서 한국어로 고정되어 request field로 선택할 수 없다.
  - selection은 필수이며 전체 논문 번역 endpoint가 아니다.
  - inline translate agent는 stateless이며 thread_id를 대화 checkpoint로 사용하지 않는다.
  - run.completed에는 비용이나 token usage field가 없다.
  - model provider와 active variant는 server-owned이며 request/event에 노출되지 않는다.
